services:
  mineguard-ai:
    build:
      context: ../..
      dockerfile: mineguard/Dockerfile
    restart: unless-stopped
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:?INFLUXDB_TOKEN is required}
    depends_on:
      mosquitto:
        condition: service_healthy
      influxdb:
        condition: service_healthy
